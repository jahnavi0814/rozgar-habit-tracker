openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Authenticated Rozgar habit tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Current-user profile
  - name: habits
    description: Habit management and daily check-ins
  - name: progress
    description: Timezone-aware progress summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's profile
      parameters:
        - name: timeZone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid time zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List the current user's habits
      responses:
        "200":
          description: Habits and their status for the user's local day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          description: Invalid habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /habits/{habitId}:
    parameters:
      - name: habitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get one of the current user's habits
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update or pause/resume a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "400":
          description: Invalid habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit and its check-ins
      responses:
        "204":
          description: Habit deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /habits/{habitId}/check-in:
    parameters:
      - name: habitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setHabitCheckIn
      tags: [habits]
      summary: Record or update today's check-in for a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Saved check-in for the user's local day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInStatus"
        "400":
          description: Invalid check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Habit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /progress/week:
    get:
      operationId: getWeeklyProgress
      tags: [progress]
      summary: Get the previous seven local calendar days
      responses:
        "200":
          description: Saved check-in history in the user's timezone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekProgress"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserProfile:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: ["string", "null"]
        timeZone:
          type: string
        remindersEnabled:
          type: boolean
      required: [id, displayName, timeZone, remindersEnabled]
    UserProfileInput:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: ["string", "null"]
          maxLength: 50
        timeZone:
          type: string
          maxLength: 100
        remindersEnabled:
          type: boolean
    Habit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        frequency:
          type: string
          enum: [daily, weekdays]
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        reminderTime:
          type: ["string", "null"]
        isActive:
          type: boolean
        completedToday:
          type: boolean
        scheduledToday:
          type: boolean
      required:
        - id
        - name
        - description
        - frequency
        - weekdays
        - reminderTime
        - isActive
        - completedToday
        - scheduledToday
    HabitInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 140
        frequency:
          type: string
          enum: [daily, weekdays]
        weekdays:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6
        reminderTime:
          type: ["string", "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      required: [name, frequency, weekdays]
    HabitUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 140
        frequency:
          type: string
          enum: [daily, weekdays]
        weekdays:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6
        reminderTime:
          type: ["string", "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        isActive:
          type: boolean
    CheckInInput:
      type: object
      properties:
        completed:
          type: boolean
      required: [completed]
    CheckInStatus:
      type: object
      properties:
        habitId:
          type: string
          format: uuid
        localDate:
          type: string
          format: date
        completed:
          type: boolean
      required: [habitId, localDate, completed]
    WeekDayProgress:
      type: object
      properties:
        localDate:
          type: string
          format: date
        weekday:
          type: string
          enum: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        scheduledCount:
          type: integer
          minimum: 0
        completedCount:
          type: integer
          minimum: 0
        recorded:
          type: boolean
        percent:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - localDate
        - weekday
        - scheduledCount
        - completedCount
        - recorded
        - percent
    WeekProgress:
      type: object
      properties:
        timeZone:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/WeekDayProgress"
        totalCompleted:
          type: integer
          minimum: 0
        totalScheduled:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
        recordedDays:
          type: integer
          minimum: 0
          maximum: 7
      required:
        - timeZone
        - days
        - totalCompleted
        - totalScheduled
        - percent
        - recordedDays
security:
  - clerkSession: []

